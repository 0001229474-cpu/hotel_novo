<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Hotel</title>
</head>
<body>
    <h1>Hotel.Luxo</h1>
    <h2>Cadastro de Hotel</h2>

    <form action="salvar_hotel.php" method="post">

    <label>Nome do Hotel:</label>
    <input type="text" name="nome_hotel" required>
    <br><br>

    <label>Cidade:</label>
    <input type="text" name="cidade" required>
    <br><br>

    <label>Classificação em Estrelas:</label>
    <input type="number" name="escrelas" min="1" max="5" required>
    <br><br>

    <button type="submit">Cadastro finalizado</button>
    </form>

    <a href="inde.html">Valtar para a página principal</a>
</body>
</html>
